<text x="34" y="38" class="mono" font-size="12" fill="#4ea4af" letter-spacing="3">PROJECT_03 // MACHINE LEARNING</text>
<circle class="blink" cx="478" cy="34" r="4.5" fill="#2ee6ff" filter="url(#glow)"/>
<text x="586" y="38" text-anchor="end" class="mono" font-size="12" fill="#2ee6ff" letter-spacing="2">OPEN SOURCE</text>
<text x="32" y="82" class="sans" font-size="28" font-weight="800" fill="#2ee6ff" filter="url(#glow-sm)">Churn Prediction</text>
<text x="34" y="116" class="sans" font-size="15" fill="#c3d6dc">Benchmarked a dozen classifiers, then tuned voting,</text>
<text x="34" y="138" class="sans" font-size="15" fill="#c3d6dc">bagging and stacking ensembles: 98.1% test accuracy and</text>
<text x="34" y="160" class="sans" font-size="15" fill="#c3d6dc">ROC-AUC 0.98 on 5,630 customers.</text>
