<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="620" height="280" viewBox="0 0 620 280" role="img" aria-label="Churn Prediction">
<title>Churn Prediction</title>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-sm" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="1.1" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-lg" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#0a1c22" stroke-width="1"/>
  </pattern>
  <pattern id="hazard" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="5" height="10" fill="#ff8a1c"/>
  </pattern>
  <linearGradient id="name-grad" x1="0" x2="1">
    <stop offset="0" stop-color="#c9fcff"/>
    <stop offset=".5" stop-color="#2ee6ff"/>
    <stop offset="1" stop-color="#4ea4af"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#2ee6ff" stop-opacity="0"/>
    <stop offset=".85" stop-color="#2ee6ff" stop-opacity=".18"/>
    <stop offset="1" stop-color="#2ee6ff" stop-opacity=".55"/>
  </linearGradient>
</defs>
<style>
  .mono { font-family: Consolas, 'Cascadia Code', 'Courier New', monospace; }
  .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .pulse { fill: none; stroke: #2ee6ff; stroke-width: 2; stroke-linecap: round;
           stroke-dasharray: 26 900; animation: run 3.2s linear infinite; filter: url(#glow); }
  .trace { fill: none; stroke: #0f3a44; stroke-width: 1.4; }
  .node { fill: #02070a; stroke: #4ea4af; stroke-width: 1.4; }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
  .spin-r { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite reverse; }
  .spin-s { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .breathe { animation: breathe 2.6s ease-in-out infinite; }
  .boot { opacity: 0; animation: boot .7s ease-out forwards; }
  @keyframes run { from { stroke-dashoffset: 926; } to { stroke-dashoffset: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes breathe { 50% { opacity: .35; } }
  @keyframes boot { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
